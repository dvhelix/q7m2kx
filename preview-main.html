<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex, nofollow" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐉</text></svg>" />
<title>메인 화면 프리뷰 — 드래곤 비벨/이벨 통합 계산기</title>
<link rel="stylesheet" href="assets/styles/01-tokens.css" />
<link rel="stylesheet" href="assets/styles/02-base.css" />
<link rel="stylesheet" href="assets/styles/09-main-menu.css" />
<link rel="stylesheet" href="assets/styles/06-responsive.css" />
<style>
  /* 프리뷰 전용: 로그인 게이트 없이 메인 화면만 즉시 보여준다 */
  body{ margin:0; }
  #mainMenu{ display:flex !important; }
  .pv-bar{
    position:fixed; top:0; left:0; right:0; z-index:99999;
    background:#7c3aed; color:#fff; font-size:12px; font-weight:700;
    padding:7px 14px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",sans-serif;
  }
  .pv-bar a{ color:#e9d5ff; text-decoration:underline; }
  .pv-bar .pv-note{ font-weight:400; color:#ddd6fe; }
  #mainMenu.active{ padding-top:64px; }
</style>
</head>
<body>
<div class="pv-bar">
  <span>🔍 메인 화면 프리뷰</span>
  <span class="pv-note">로그인 게이트 · Firebase 없이 화면만 렌더링합니다. 버튼은 어떤 세션으로 가는지만 알려줍니다.</span>
  <a href="index.html">→ 실제 계산기 열기</a>
</div>
<div id="mainMenu" class="active">
  <div class="main-header">
    <div class="main-header-tag">Dragon Village</div>
    <h1>드래곤 <span>비벨 / 이벨 계산기</span></h1>
    <p class="main-header-sub">비벨 · 이벨 통합 최적 분배 · <b>made by 헬릭스</b></p>
    <div class="main-user-bar"><b id="mainUserLabel">-</b> 님 환영합니다</div>
  </div>
  <div id="weeklyBuffBox" style="width:100%;max-width:820px;margin:0 auto 20px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.09);border-radius:14px;padding:14px 18px;box-sizing:border-box;">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <span style="font-size:13px;font-weight:700;color:#e2e8f0;">이번 주 버프 / 너프</span>
      <span id="weeklyBuffSummary" style="font-size:12px;color:#93c5fd;flex:1;min-width:150px;">-</span>
      <button type="button" onclick="applyWeeklyBuffFromServer()" style="font-size:12px;font-weight:600;padding:6px 14px;background:#2563eb;border:none;color:#fff;border-radius:8px;cursor:pointer;">이번주 버프를 계산기에 적용</button>
    </div>
  </div>
  <div class="main-cards">
    <button class="mcard mc1" onclick="enterCalc('auto')">
      <div class="mcard-title">자동 계산기</div>
      <div class="mcard-desc">인벤토리 기반으로 드래곤별 최적 장신구/정령을 자동 분배합니다</div>
      <div class="mcard-cta">입장하기 →</div>
    </button>
    <button class="mcard mc3" onclick="enterCalc('spirit')">
      <div class="mcard-title">정령 예측기</div>
      <div class="mcard-desc">정령 적용 시 타입별 비벨 변화를 예측·비교합니다</div>
      <div class="mcard-cta">입장하기 →</div>
    </button>
    <button class="mcard mc5" onclick="enterCalc('allspirit')">
      <div class="mcard-title">전체 정령 계산</div>
      <div class="mcard-desc">보관함의 모든 정령을 이번 주 버프 기준으로 한 번에 계산·순위화합니다</div>
      <div class="mcard-cta">입장하기 →</div>
    </button>
    <button class="mcard mc2" onclick="enterCalc('tournament')">
      <div class="mcard-title">토너먼트 계산</div>
      <div class="mcard-desc">정령·버프 없이, 저장된 장신구·펜던트로 최고 비벨 타입/세팅을 찾습니다</div>
      <div class="mcard-cta">입장하기 →</div>
    </button>
    <button class="mcard mc2" onclick="enterCalc('manual')">
      <div class="mcard-title">수동 계산기</div>
      <div class="mcard-desc">스탯을 직접 입력해 비벨/이벨을 즉시 계산합니다</div>
      <div class="mcard-cta">입장하기 →</div>
    </button>
    <button class="mcard mc4" onclick="enterCalc('storage')">
      <div class="mcard-title">내 정령 보관함</div>
      <div class="mcard-desc">보유한 정령을 저장·관리하고 계산기로 보냅니다</div>
      <div class="mcard-cta">입장하기 →</div>
    </button>
    <button class="mcard mc6" onclick="enterCalc('accstore')">
      <div class="mcard-title">내 장신구/펜던트</div>
      <div class="mcard-desc">보유 장신구·펜던트를 저장하면 계산기에서 바로 불러옵니다</div>
      <div class="mcard-cta">입장하기 →</div>
    </button>
    <button class="mcard mc3" onclick="location.href='submit.html'">
      <div class="mcard-title">스탯 제출</div>
      <div class="mcard-desc">드래곤 스탯을 입력해 길드전 슬롯으로 제출합니다</div>
      <div class="mcard-cta">입장하기 →</div>
    </button>
    <button class="mcard mca" id="adminMenuBtn" onclick="openAdminLogin()" style="display:none">
      <div class="mcard-right">
        <div class="mcard-title">관리자 패널</div>
        <div class="mcard-desc">유저 계정 생성·정지, 비밀번호 재설정, 관리자 추가</div>
      </div>
      <div class="mcard-cta">입장 →</div>
    </button>
  </div>
  <div class="main-foot">
    <span class="main-foot-txt">Dragon Village 길드 계산기 · 로그인은 로그아웃 전까지 유지됩니다</span>
    <div class="main-foot-actions">
      <button class="main-foot-btn" onclick="openGameNickModal('edit')" title="관리자에게 표시되는 인게임 닉네임을 변경합니다">닉네임 변경</button>
      <button class="main-foot-btn" onclick="clearCalcCaches()" title="계산기 캐시를 비우고 정령·장신구는 서버에서 다시 불러옵니다">캐시 삭제</button>
      <button class="main-foot-btn main-foot-logout" onclick="_forceLogout()">로그아웃</button>
    </div>
  </div>
</div>
